{% extends "base.html" %}
{% block title %}अभ्यासः — पाणिनि-यन्त्रम्{% endblock %}
{% block head_extra %}
<style>
  .ab-fams button,.ab-views button,.ab-opt,.ab-btns button,.ab-list button,.ab-tf .bt button,.ab-star{color:var(--ink)}
  .ab-fams{display:flex;flex-wrap:wrap;gap:.35rem;margin:.4rem 0 .6rem}
  .ab-fams button,.ab-views button{border:1px solid var(--line);background:var(--bg-panel);border-radius:999px;padding:.25rem .8rem;cursor:pointer;font-family:var(--dev);font-size:15px}
  .ab-fams button.on,.ab-views button.on{background:var(--accent);color:#fff !important;border-color:var(--accent)}
  .ab-views{display:flex;gap:.35rem;margin:.2rem 0 .8rem;flex-wrap:wrap;align-items:center}
  .ab-views .sp{flex:1}
  .ab-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:1rem}
  @media (max-width:900px){.ab-grid{grid-template-columns:1fr}}
  .ab-card{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:1rem 1.2rem}
  .ab-drill{font-size:13px;color:var(--ink-dim);letter-spacing:.02em}
  .ab-title{font-family:var(--dev);font-size:calc(20px*var(--ab-scale,1));margin:.2rem 0}
  .ab-prompt{font-family:var(--dev);font-size:calc(24px*var(--ab-scale,1));margin:.4rem 0 .8rem;color:var(--accent)}
  .ab-glyph{font-size:calc(56px*var(--ab-scale,1));line-height:1.2}
  .ab-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.5rem}
  .ab-opt{border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem;background:var(--bg);cursor:pointer;font-family:var(--dev);font-size:calc(19px*var(--ab-scale,1));text-align:left}
  .ab-opt:hover{border-color:var(--accent-dim)}
  .ab-opt.good{background:#e6f3e6;border-color:var(--success)} .ab-opt.bad{background:#f8e4e4;border-color:var(--danger)}
  .ab-opt.sel{outline:2px solid var(--accent)}
  .ab-opt small{display:block;font-size:12px;color:var(--ink-faint);font-family:var(--body)}
  .ab-in{font-family:var(--dev);font-size:calc(20px*var(--ab-scale,1));padding:.35rem .5rem;border:1px solid var(--line);border-radius:6px;min-width:220px}
  .ab-in.good{border-color:var(--success);background:#eef7ee} .ab-in.bad{border-color:var(--danger);background:#fbeeee}
  .ab-btns{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.9rem}
  .ab-btns button{padding:.35rem .9rem;border-radius:6px;border:1px solid var(--line);background:var(--bg-subtle);cursor:pointer;font-family:var(--dev)}
  .ab-btns button.go{background:var(--accent);color:#fff !important;border-color:var(--accent)}
  .ab-fb{margin-top:.8rem;font-size:15px}
  .ab-fb .ok{color:var(--success);font-weight:600} .ab-fb .no{color:var(--danger);font-weight:600}
  .ab-src{display:inline-flex;gap:.25rem;margin-left:.4rem;vertical-align:middle}
  .ab-src span{font-size:11px;border-radius:4px;padding:1px 5px;border:1px solid var(--line);color:var(--ink-dim);background:var(--bg)}
  .ab-src span.engine{border-color:var(--success);color:var(--success)} .ab-src span.vidyut{border-color:#2a5d8f;color:#2a5d8f}
  .ab-src span.corpus{border-color:var(--warn);color:var(--warn)} .ab-src span.only{border-color:var(--danger);color:var(--danger)}
  .ab-note{font-size:13px;color:var(--warn);margin:.2rem 0}
  .ab-tbl{border-collapse:collapse;width:100%;margin-top:.5rem}
  .ab-tbl th,.ab-tbl td{border:1px solid var(--line-soft);padding:.3rem .45rem;font-family:var(--dev);font-size:calc(16px*var(--ab-scale,1))}
  .ab-tbl th{background:var(--bg-subtle);font-weight:500;font-size:14px}
  .ab-tbl td.click{cursor:pointer} .ab-tbl td.click:hover{background:var(--bg-subtle)}
  .ab-tbl input{width:100%;box-sizing:border-box;font-family:var(--dev);font-size:16px;border:1px solid var(--line);border-radius:4px;padding:.15rem .3rem}
  .ab-side label{display:block;font-size:13px;color:var(--ink-dim);margin:.45rem 0 .15rem}
  .ab-side select,.ab-side input[type=text]{width:100%;box-sizing:border-box;padding:.25rem;font-family:var(--dev)}
  .ab-side .chk{display:flex;flex-wrap:wrap;gap:.2rem .6rem;font-size:13px}
  .ab-side .chk label{display:inline-flex;gap:.25rem;margin:0;color:var(--ink)}
  .ab-score{font-size:13px;color:var(--ink-dim)}
  .ab-match{display:grid;grid-template-columns:1fr 1fr;gap:.4rem .8rem}
  .ab-tf{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.35rem .8rem;align-items:center;font-family:var(--dev);font-size:calc(18px*var(--ab-scale,1))}
  .ab-tf .bt button{margin-left:.25rem;padding:.15rem .6rem;border:1px solid var(--line);border-radius:5px;background:var(--bg);cursor:pointer}
  .ab-tf .bt button.on{background:var(--accent);color:#fff !important}
  .ab-tf .res.good{color:var(--success)} .ab-tf .res.bad{color:var(--danger)}
  .ab-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.35rem;max-height:60vh;overflow:auto}
  .ab-list button{text-align:left;border:1px solid var(--line-soft);background:var(--bg);border-radius:6px;padding:.3rem .5rem;cursor:pointer;font-family:var(--dev)}
  .ab-list button small{display:block;color:var(--ink-faint);font-family:var(--body);font-size:11px}
  .ab-steps{font-size:14px;margin:.4rem 0;padding-left:1.2rem;font-family:var(--dev)}
  .ab-star{cursor:pointer;color:var(--warn) !important;font-size:18px;border:none;background:none}
  .ab-en{font-size:calc(19px*var(--ab-scale,1));font-family:var(--body);margin:.3rem 0 .8rem}
</style>
{% endblock %}
{% block content %}
<div class="panel">
  <h1>अभ्यासः <span class="muted" style="font-size:14px;font-weight:400" data-l="sub">every answer is derived by our engine, checked with Vidyut and the printed paradigms</span></h1>
  <div class="ab-fams" id="fams" role="tablist" aria-label="विषयाः"></div>
  <div class="ab-views no-print">
    <button data-v="practice" class="on" data-l="v_practice">अभ्यास</button>
    <button data-v="list" data-l="v_list">सूचियाँ</button>
    <button data-v="compare" data-l="v_compare">तुलना</button>
    <button data-v="fav" data-l="v_fav">पसंदीदा ★</button>
    <button data-v="pratyaya" data-l="v_pratyaya">प्रत्ययाः</button>
    <span class="sp"></span>
    <span class="ab-score" id="score"></span>
    <button id="fs-" title="छोटा / smaller">अ−</button><button id="fs+" title="बड़ा / larger">अ+</button>
    <select id="ui-lang" aria-label="language"><option value="hi">हिन्दी</option><option value="en">English</option><option value="sa">संस्कृतम्</option></select>
    <select id="sch" aria-label="उत्तर-लिपिः"><option value="devanagari">देवनागरी</option><option value="iast">IAST</option><option value="slp1">SLP1</option><option value="hk">HK</option></select>
  </div>
  <div id="view"></div>
</div>
<div class="panel" id="why" hidden></div>
{% endblock %}
{% block body_extra %}
<script src="{{ url_for('static', filename='abhyasa.js') }}"></script>
{% endblock %}
