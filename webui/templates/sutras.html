{% extends "base.html" %}
{% block title %}सूत्र-सूची — पाणिनि-यन्त्रम्{% endblock %}

{% block content %}
<div style="display:flex;align-items:baseline;gap:12px;margin-bottom:12px;">
  <h1 style="margin:0;">सूत्र-सूची</h1>
  <span class="muted" style="font-size:13px;">पाणिनीय-सूत्राणाम् अनुक्रमणिका</span>
</div>

<div class="sutra-search-wrap">
  <input class="sutra-search" id="sutraSearch" type="search"
         placeholder="सूत्र खोजें… ID (6.1.97), Devanāgarī text, या अंग्रेज़ी"
         autocomplete="off" oninput="filterSutras(this.value)">
  <span id="sutraCount" style="font-size:12px;color:var(--ink-faint);margin-top:4px;display:block"></span>
</div>

<div class="panel">
  <div class="form-row" style="gap:8px;align-items:center;">
    <input id="s-search" type="text" placeholder="सूत्र-क्रमाङ्केन वा पाठेन अन्वेषयतु…"
           style="flex:1;max-width:420px;" autocomplete="off">
    <div id="s-type-bar" style="display:flex;flex-wrap:wrap;gap:4px;"></div>
    <span class="muted" id="s-count" style="font-size:12px;margin-left:8px;"></span>
  </div>
  <div id="s-view-bar" style="display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:8px;">
    <span class="muted" style="font-size:12px;">क्रमः · order:</span>
    <button class="pl-cat-btn active" data-v="">अष्टाध्यायी</button>
    <button class="pl-cat-btn" data-v="lsk" title="Laghusiddhāntakaumudī — the sūtras in the book's order (as ashtadhyayi.com/sutraani/lsk15)">लघुसिद्धान्तकौमुदी</button>
    <button class="pl-cat-btn" data-v="sk" title="Siddhāntakaumudī — the sūtras in the book's order">सिद्धान्तकौमुदी</button>
  </div>
</div>

<div id="s-body">
  <div class="panel" style="text-align:center;color:var(--ink-faint);">
    <span class="loading"></span> सूत्राणि लाद्यन्ते…
  </div>
</div>
{% endblock %}

{% block body_extra %}
<script>
const _TYPE_DEV = {
  "VIDHI"       : "विधिः",
  "PARIBHASHA"  : "परिभाषा",
  "SAMJNA"      : "संज्ञा",
  "ADHIKARA"    : "अधिकारः",
  "ANUVADA"     : "अनुवादः",
  "NIYAMA"      : "नियमः",
  "ATIDESA"     : "अतिदेशः",
  "PRATISHEDHA" : "प्रतिषेधः",
  "UTSARGA"     : "उत्सर्गः",
  "APAVADA"     : "अपवादः",
};
function typeDev(t) { return _TYPE_DEV[t] || t; }
function escH(s) {
  if (!s) return "";
  return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
}

let _notes = {};
let _kau = {};
let _view = "";
let _all = [];
let _activeType = "";
let _search = "";

async function init() {
  const r = await fetch("/api/sutras");
  const data = await r.json();
  _all = [];
  for (const [type, rows] of Object.entries(data.by_type)) {
    rows.forEach(s => _all.push({ ...s, sutra_type: type }));
  }
  _all.sort((a, b) => {
    const pa = a.sutra_id.split(".").map(Number);
    const pb = b.sutra_id.split(".").map(Number);
    for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
      if ((pa[i]||0) !== (pb[i]||0)) return (pa[i]||0) - (pb[i]||0);
    }
    return 0;
  });
  try { _kau = await (await fetch("/api/kaumudi-order")).json(); } catch (e) { _kau = {}; }
  const qv = new URLSearchParams(location.search).get("view"); if (qv === "lsk" || qv === "sk") setView(qv);
  try { _notes = await (await fetch("/api/notes-counts")).json(); } catch (e) { _notes = {}; }
  const types = [...new Set(_all.map(s => s.sutra_type))];
  buildTypeBar(types, _all.length);
  render();
}

function buildTypeBar(types, total) {
  const bar = document.getElementById("s-type-bar");
  bar.innerHTML =
    `<button class="pl-cat-btn active" data-t="">सर्वाणि <span style="opacity:.6;font-weight:400;">${total}</span></button>`;
  types.forEach(t => {
    const n = _all.filter(s => s.sutra_type === t).length;
    const btn = document.createElement("button");
    btn.className = "pl-cat-btn";
    btn.dataset.t = t;
    btn.innerHTML = `${escH(typeDev(t))} <span style="opacity:.6;font-weight:400;">${n}</span>`;
    bar.appendChild(btn);
  });
  bar.querySelectorAll(".pl-cat-btn").forEach(b => {
    b.addEventListener("click", () => {
      bar.querySelectorAll(".pl-cat-btn").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      _activeType = b.dataset.t;
      render();
    });
  });
}

function setView(v) {
  _view = v;
  document.querySelectorAll("#s-view-bar .pl-cat-btn").forEach(b => b.classList.toggle("active", b.dataset.v === v));
}

function filtered() {
  const rows = _all.filter(s => {
    if (_view && !(_kau[s.sutra_id] && _kau[s.sutra_id][_view])) return false;
    if (_activeType && s.sutra_type !== _activeType) return false;
    if (_search) {
      const q = _search.toLowerCase();
      return s.sutra_id.includes(q) ||
             (s.text_dev  || "").toLowerCase().includes(q) ||
             (s.why_dev   || "").toLowerCase().includes(q);
    }
    return true;
  });
  return _view ? rows.sort((a, b) => _kau[a.sutra_id][_view] - _kau[b.sutra_id][_view]) : rows;
}

function render() {
  const items = filtered();
  document.getElementById("s-count").textContent = `${items.length} सूत्राणि`;
  const body = document.getElementById("s-body");
  if (!items.length) {
    body.innerHTML = `<div class="panel" style="text-align:center;color:var(--ink-faint);">कोऽपि सूत्रं न मिलति</div>`;
    return;
  }
  let html = `<table class="matrix" style="width:100%;border-collapse:collapse;">
    <thead><tr>
      ${_view ? `<th style="text-align:right;padding:6px 8px;font-size:11px;color:var(--ink-faint);">${_view === "lsk" ? "ल.सि.कौ." : "सि.कौ."}</th>` : ""}
      <th style="text-align:left;padding:6px 8px;font-size:11px;color:var(--ink-faint);">क्रमाङ्कः</th>
      <th style="text-align:left;padding:6px 8px;font-size:11px;color:var(--ink-faint);">प्रकारः</th>
      <th style="text-align:left;padding:6px 8px;font-size:11px;color:var(--ink-faint);">सूत्रम्</th>
      <th style="text-align:left;padding:6px 8px;font-size:11px;color:var(--ink-faint);">विवरणम्</th>
    </tr></thead><tbody>`;
  items.forEach(s => {
    html += `<tr id="${escH(s.sutra_id)}" style="border-top:1px solid var(--line-soft);cursor:pointer;"
                 onclick="location.href='/sutra/${encodeURIComponent(s.sutra_id)}'">
      ${_view ? `<td style="padding:6px 8px;text-align:right;font-family:var(--mono);font-size:12px;">${_kau[s.sutra_id][_view]}${_kau[s.sutra_id][_view + "c"] ? `<small class="muted" title="prakaraṇa">·${_kau[s.sutra_id][_view + "c"]}</small>` : ""}</td>` : ""}
      <td style="padding:6px 8px;font-family:var(--mono);font-size:12px;white-space:nowrap;">
        <a href="/sutra/${encodeURIComponent(s.sutra_id)}" style="color:var(--accent);">${escH(s.sutra_id)}</a>${_notes[s.sutra_id] ? ` <span class="muted" title="${_notes[s.sutra_id].n} audit note(s), ${_notes[s.sutra_id].open} open" style="font-size:11px">✎${_notes[s.sutra_id].n}${_notes[s.sutra_id].open ? "·" + _notes[s.sutra_id].open + " open" : ""}</span>` : ""}
      </td>
      <td style="padding:6px 8px;font-size:11px;color:var(--ink-dim);">${escH(typeDev(s.sutra_type))}${s.placeholder ? ' <span title="not yet implemented">○</span>' : ' <span title="implemented">●</span>'}</td>
      <td style="padding:6px 8px;" class="dev">${escH(s.text_dev || "")}</td>
      <td style="padding:6px 8px;font-size:12px;color:var(--ink-dim);" class="dev">${escH(s.why_dev || "")}</td>
    </tr>`;
  });
  html += `</tbody></table>`;
  body.innerHTML = `<div class="panel" style="padding:0;overflow-x:auto;">${html}</div>`;
}

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("s-view-bar").addEventListener("click", e => {
    const b = e.target.closest("button[data-v]"); if (!b) return;
    setView(b.dataset.v); render();
    history.replaceState(null, "", b.dataset.v ? "?view=" + b.dataset.v : location.pathname);
  });
  init();
  document.getElementById("s-search").addEventListener("input", e => {
    _search = e.target.value.trim();
    render();
  });
});

/* Sticky search bar helper — delegates to existing _search / render() */
function filterSutras(q) {
  _search = q.trim();
  render();
  const cnt = document.getElementById('sutraCount');
  if (cnt) {
    const visible = filtered().length;
    cnt.textContent = q.trim() ? `${visible} सूत्र मिले` : '';
  }
  /* Keep the classic search field in sync */
  const classic = document.getElementById('s-search');
  if (classic && classic.value !== q) classic.value = q;
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('sutraSearch')?.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.target.value = ''; filterSutras(''); }
  });
});
</script>
{% endblock %}
