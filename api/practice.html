<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>अभ्यास — Pāṇini Practice</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Spectral:wght@400;600&display=swap">
<style>
:root{
  --ground:#f3ece0; --panel:#fbf7ef; --band:#d8c49a; --band-soft:#e7d9bb;
  --row:#fdfbf7; --ink:#241d12; --ink-soft:#5d5140; --ink-faint:#8d8069;
  --rule:#d9ccb2; --indigo:#2c4a7c; --madder:#9c3822; --moss:#3f6b4a; --select:#f6e6a8;
  --dev:"Noto Serif Devanagari","Noto Sans Devanagari",serif;
  --mono:"IBM Plex Mono",Menlo,monospace; --body:"Spectral",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#17140f; --panel:#201b14; --band:#3d3325; --band-soft:#2b2419;
    --row:#1d1811; --ink:#ece3d2; --ink-soft:#b0a58f; --ink-faint:#857a66;
    --rule:#3a3125; --indigo:#8fb0e2; --madder:#e08a6e; --moss:#87bd91; --select:#4a3f20;
  }
}
:root[data-theme="dark"]{
  --ground:#17140f; --panel:#201b14; --band:#3d3325; --band-soft:#2b2419;
  --row:#1d1811; --ink:#ece3d2; --ink-soft:#b0a58f; --ink-faint:#857a66;
  --rule:#3a3125; --indigo:#8fb0e2; --madder:#e08a6e; --moss:#87bd91; --select:#4a3f20;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.6 var(--body)}
header{display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;align-items:baseline;
  padding:.9rem 16px;background:var(--band);border-bottom:1px solid var(--rule)}
header h1{font-family:var(--dev);font-size:1.15rem;margin:0;font-weight:600}
header .sub{font-size:.84rem;color:var(--ink-soft)}
header .score{margin-left:auto;font-family:var(--mono);font-size:.78rem;color:var(--ink-soft)}
header a{color:var(--indigo)}
.controls{display:flex;flex-wrap:wrap;gap:.5rem .9rem;padding:.8rem 16px;
  border-bottom:1px solid var(--rule);background:var(--panel)}
.controls label{display:flex;flex-direction:column;font-size:.74rem;color:var(--ink-soft);gap:.15rem}
select,button,input{font:inherit;color:var(--ink)}
select,input{font-size:.95rem;padding:.3rem .5rem;border:1px solid var(--rule);
  border-radius:3px;background:var(--row);font-family:var(--dev);max-width:100%}
button{cursor:pointer}
.btn{border:1px solid var(--indigo);background:var(--indigo);color:var(--ground);
  border-radius:3px;padding:.4rem .9rem;font-family:var(--dev)}
.btn.ghost{background:none;color:var(--indigo)}
main{max-width:52rem;margin:0 auto;padding:1.2rem 16px 4rem}
.prompt{font-family:var(--dev);font-size:1.2rem;line-height:1.8;margin:.2rem 0 1rem}
.prompt b{color:var(--madder);font-weight:600}
.prompt .cell{color:var(--indigo);font-weight:600}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{border:1px solid var(--rule);background:var(--row);border-radius:4px;
  padding:.9rem .8rem;font-family:var(--dev);font-size:1.15rem;text-align:center}
.opt:hover:not(:disabled){background:var(--band-soft)}
.opt:focus-visible{outline:2px solid var(--indigo);outline-offset:1px}
.opt small{display:block;font-size:.8rem;color:var(--ink-soft);margin-top:.2rem}
.opt.right{border-color:var(--moss);box-shadow:inset 0 0 0 2px var(--moss)}
.opt.wrong{border-color:var(--madder);box-shadow:inset 0 0 0 2px var(--madder)}
.opt .sid{font-family:var(--mono);font-size:.8rem;color:var(--indigo);display:block}
.step-shown{font-family:var(--dev);font-size:1.4rem;text-align:center;margin:.4rem 0 1rem}
.step-shown .arr{color:var(--madder);margin:0 .6rem}
.recall{display:flex;gap:.5rem;flex-wrap:wrap}
.recall input{flex:1;min-width:12rem;font-size:1.15rem}
.verdict{margin:1.2rem 0 .4rem;padding:.7rem .9rem;border-radius:4px;font-family:var(--dev);
  border:1px solid var(--rule);background:var(--panel)}
.verdict.ok{border-color:var(--moss);color:var(--moss)}
.verdict.no{border-color:var(--madder);color:var(--madder)}
.verdict .note{display:block;color:var(--ink-soft);font-size:.92rem;margin-top:.2rem}
.why h2{font-family:var(--dev);font-size:1.05rem;margin:1.4rem 0 .6rem}
.step{display:grid;grid-template-columns:2.2rem 1fr;gap:.5rem;margin-bottom:.8rem;
  padding-bottom:.7rem;border-bottom:1px dashed var(--rule)}
.step .n{font-family:var(--mono);font-size:.78rem;color:var(--ink-faint)}
.step .form{font-family:var(--dev);font-size:1.08rem;color:var(--madder)}
.step .sutra{font-family:var(--dev);color:var(--indigo)}
.step .sid{font-family:var(--mono);font-size:.8rem;color:var(--indigo)}
.step .hint,.step .lsk{display:block;color:var(--ink-faint);font-size:.84rem;font-family:var(--dev)}
.step.focus{background:var(--select);border-radius:3px;padding:.3rem}
.ex{border:0;background:none;color:var(--indigo);font-family:var(--dev);font-size:.84rem;
  padding:0;text-decoration:underline dotted;margin-top:.15rem}
.exlist{font-family:var(--dev);font-size:.92rem;color:var(--ink-soft);margin-top:.25rem}
.exlist b{color:var(--ink);font-weight:500}
.muted{color:var(--ink-faint);font-size:.85rem}
.err{color:var(--madder);font-family:var(--mono);font-size:.85rem}
</style>

<header>
  <h1>अभ्यास</h1>
  <span class="sub">Every answer explained sūtra by sūtra · <a href="/shabda">शब्दरूप</a></span>
  <span class="score" id="score"></span>
</header>

<div class="controls">
  <label>प्रकार <select id="kind"><option value="subanta">सुबन्त (शब्द)</option><option value="tinanta">तिङन्त (धातु)</option></select></label>
  <label>शब्द / धातु <select id="lemma"><option value="">कोई भी</option></select></label>
  <label id="lingaWrap">लिङ्ग <select id="linga"><option value="">कोई भी</option><option value="pulliṅga">पुंलिङ्ग</option><option value="strīliṅga">स्त्रीलिङ्ग</option><option value="napuṃsaka">नपुंसकलिङ्ग</option></select></label>
  <label>अभ्यास <select id="type">
    <option value="mcq">शुद्ध विकल्प चुनें</option>
    <option value="recall">रूप लिखें</option>
    <option value="tf">सत्य या असत्य</option>
    <option value="sutra">कौन-सा सूत्र? (वैयाकरण)</option>
  </select></label>
  <label>स्तर <select id="level"><option value="easy">सरल</option><option value="hard">कठिन (निकट-विकल्प)</option></select></label>
  <label>&nbsp;<button class="btn" id="next">नया प्रश्न →</button></label>
</div>

<main>
  <div id="q"><p class="muted">Loading…</p></div>
  <div id="result"></div>
  <div class="why" id="why"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch {} },
};
let Q = null, answered = false, ticket = 0;   // ticket: drop stale responses
let score = store.get("abhyasa.score", {right:0, total:0, streak:0});

function showScore(){
  $("score").textContent = `${score.right}/${score.total} · streak ${score.streak}`;
}
function tally(ok){
  score.total++; if (ok){ score.right++; score.streak++; } else score.streak = 0;
  store.set("abhyasa.score", score); showScore();
}

async function api(path, opts){
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(`${r.status} ${(await r.text()).slice(0, 200)}`);
  return r.json();
}

async function loadLemmas(){
  const kind = $("kind").value;
  $("lingaWrap").hidden = kind !== "subanta";
  const {lemmas} = await api(`/v1/practice/lemmas?kind=${kind}`);
  $("lemma").innerHTML = `<option value="">कोई भी</option>` + lemmas.map(l =>
    `<option value="${esc(l.lemma)}">${esc(l.dev)}${l.linga ? " · " + esc(l.linga) : ""}${l.id ? " · " + esc(l.id) : ""}</option>`).join("");
}

async function next(){
  answered = false; $("result").innerHTML = ""; $("why").innerHTML = "";
  const p = new URLSearchParams({kind: $("kind").value, type: $("type").value, level: $("level").value});
  if ($("lemma").value) p.set("lemma", $("lemma").value);
  if ($("kind").value === "subanta" && $("linga").value) p.set("linga", $("linga").value);
  const mine = ++ticket;
  try { const q = await api(`/v1/practice?${p}`); if (mine !== ticket) return; Q = q; render(); }
  catch (e) { $("q").innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

function render(){
  const lemma = `<b>${esc(Q.lemma_dev)}</b>`;
  const target = `<span class="cell">${esc(Q.cell_label)}</span>`;
  let h = "";
  if (Q.type === "mcq" || Q.type === "recall"){
    h = `<p class="prompt">‘<b>${esc(Q.source.dev)}</b>’ (${lemma}, ${esc(Q.source.cell_label)}) को ${target} में बदलिए।</p>`;
    h += Q.type === "mcq"
      ? `<div class="opts">${Q.options.map((o,i) => `<button class="opt" data-i="${i}">${esc(o.dev)}</button>`).join("")}</div>`
      : `<form class="recall" id="rf"><input id="ri" autocomplete="off" lang="sa" placeholder="देवनागरी में लिखें" aria-label="answer"><button class="btn">जाँचें</button></form>`;
  } else if (Q.type === "tf"){
    h = `<p class="prompt">‘<b>${esc(Q.claim)}</b>’ — ${lemma} का ${target} रूप है।</p>
         <div class="opts"><button class="opt" data-tf="1">सत्य</button><button class="opt" data-tf="0">असत्य</button></div>`;
  } else {
    h = `<p class="prompt">${lemma} → ${target} की प्रक्रिया में यह परिवर्तन किस सूत्र से हुआ?</p>
         <p class="step-shown">${esc(Q.before_dev)}<span class="arr">→</span>${esc(Q.after_dev)}</p>
         <div class="opts">${Q.options.map((o,i) => `<button class="opt" data-i="${i}">${esc(o.text_dev)}<span class="sid">${esc(o.sutra_id)}</span></button>`).join("")}</div>`;
  }
  $("q").innerHTML = h;
  $("q").querySelectorAll(".opt").forEach(b => b.onclick = () => answer(b));
  const rf = $("rf");
  if (rf){ rf.onsubmit = e => { e.preventDefault(); answer(null, $("ri").value); }; $("ri").focus(); }
}

const norm = s => s.normalize("NFC").replace(/[\s।॥.]+/g, "");

function answer(btn, typed){
  if (answered) return; answered = true;
  let ok, note = "";
  const buttons = [...$("q").querySelectorAll(".opt")];
  if (Q.type === "mcq"){
    const o = Q.options[+btn.dataset.i];
    ok = Q.accepted.includes(o.dev);
    buttons.forEach((b, i) => {
      const x = Q.options[i];
      b.innerHTML = `${esc(x.dev)}<small>${esc(x.cell_label)}</small>`;
      if (Q.accepted.includes(x.dev)) b.classList.add("right");
    });
    if (!ok){ btn.classList.add("wrong"); note = `आपने चुना ‘${o.dev}’ — यह ${Q.lemma_dev} का ${o.cell_label} रूप है।`; }
  } else if (Q.type === "recall"){
    ok = Q.accepted.some(a => norm(a) === norm(typed || ""));
    if (!ok) note = `आपने लिखा ‘${typed || "—"}’।`;
  } else if (Q.type === "tf"){
    ok = (btn.dataset.tf === "1") === Q.answer;
    btn.classList.add(ok ? "right" : "wrong");
    if (!Q.answer) note = `‘${Q.claim}’ ${Q.lemma_dev} का ${Q.labels[Q.claim] || "अन्य"} रूप है, ${Q.cell_label} नहीं।`;
  } else {
    const o = Q.options[+btn.dataset.i];
    ok = o.sutra_id === Q.answer_sutra;
    buttons.forEach((b, i) => { if (Q.options[i].sutra_id === Q.answer_sutra) b.classList.add("right"); });
    if (!ok) btn.classList.add("wrong");
  }
  buttons.forEach(b => b.disabled = true);
  tally(ok);
  $("result").innerHTML = `<div class="verdict ${ok ? "ok" : "no"}">${ok ? "✓ शुद्ध" : "✗ अशुद्ध"} — ${esc(Q.lemma_dev)}, ${esc(Q.cell_label)}: <b>${esc(Q.accepted.join(" / "))}</b>${note ? `<span class="note">${esc(note)}</span>` : ""}</div>`;
  explain();
}

async function explain(){
  $("why").innerHTML = `<h2>क्यों? — प्रक्रिया</h2><p class="muted">deriving…</p>`;
  const f = Q.features;
  const [path, body] = Q.kind === "subanta"
    ? ["/v1/subanta", {stem: Q.lemma, vibhakti: f.vibhakti, vacana: f.vacana, linga: f.linga}]
    : ["/v1/tinanta", {dhatu: Q.dhatu_ref || Q.lemma, lakara: f.lakara, prayoga: f.prayoga, purusha: f.purusha, vacana: f.vacana}];
  try {
    const mine = ticket;
    const d = await api(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    if (mine !== ticket) return;
    const steps = d.steps.filter(s => s.changed && s.sutra_id && !s.sutra_id.startsWith("__"));
    $("why").innerHTML = `<h2>क्यों? — ${esc(d.surface.dev)} की प्रक्रिया (${steps.length} सूत्र)</h2>` + steps.map(s => `
      <div class="step${s.sutra_id === Q.answer_sutra ? " focus" : ""}">
        <span class="n">${s.n}</span>
        <div><span class="form">${esc(s.before.dev)} → ${esc(s.after.dev)}</span><br>
          <span class="sid">${esc(s.sutra_id)}</span> <span class="sutra">${esc(s.text_dev || "")}</span>
          ${s.hint_hi ? `<span class="hint">${esc(s.hint_hi)} <i>(unreviewed)</i></span>` : ""}
          ${s.lsk && s.lsk.length ? `<span class="lsk">LSK Study Guide: ${s.lsk.slice(0, 3).map(p => `भाग ${p.part} पृ. ${p.page}`).join(", ")}</span>` : ""}
          <button class="ex" data-sid="${esc(s.sutra_id)}">यही सूत्र और कहाँ? — उदाहरण</button><div class="exlist"></div>
        </div>
      </div>`).join("");
    $("why").querySelectorAll(".ex").forEach(b => b.onclick = () => examples(b));
  } catch (e) { $("why").innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

async function examples(btn){
  const out = btn.nextElementSibling;
  out.textContent = "…";
  try {
    const {examples: e} = await api(`/v1/sutras/${encodeURIComponent(btn.dataset.sid)}`);
    out.innerHTML = e.forms.length
      ? e.forms.map(f => `<b>${esc(f.dev)}</b> (${esc(f.lemma_dev)}, ${esc(f.cell_label)})`).join(" · ")
        + (e.total > e.forms.length ? ` <span class="muted">— कुल ${e.total} सत्यापित रूप</span>` : "")
      : `<span class="muted">कोई सत्यापित उदाहरण नहीं</span>`;
  } catch (err) { out.innerHTML = `<span class="err">${esc(err.message)}</span>`; }
}

$("next").onclick = next;
$("kind").onchange = async () => { await loadLemmas(); next(); };
["lemma", "linga", "type", "level"].forEach(id => $(id).onchange = next);
showScore();
loadLemmas().then(next);
</script>
